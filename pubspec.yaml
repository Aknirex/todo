name: aknirex_todo
description: A local-first Todo workspace for Android and iOS.
publish_to: none
version: 0.2.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  characters: ^1.4.1
  drift: ^2.30.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.30.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
